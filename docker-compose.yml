services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: baxi_brothers
    ports:
      - "5432:5432"
    volumes:
      - baxi_brothers_pgdata:/var/lib/postgresql/data

volumes:
  baxi_brothers_pgdata:
